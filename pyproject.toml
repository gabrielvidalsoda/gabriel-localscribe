[project]
name = "gabriel-localscribe"
version = "0.1.0"
description = "Transcribe audio and video files to text and subtitles locally using faster-whisper."
authors = [{ name = "Gabriel Vidal", email = "gabrielvidalsoda@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"
dependencies = [
  "faster-whisper>=1.0,<2.0",
  "pydub>=0.25.1,<0.26",
  "audioop-lts>=0.2 ; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/gabrielvidalsoda/gabriel-localscribe"
Repository = "https://github.com/gabrielvidalsoda/gabriel-localscribe"

[project.scripts]
localscribe = "localscribe.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "localscribe", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"

[tool.pytest.ini_options]
addopts = "-m \"not slow\""
markers = [
  "slow: real end-to-end tests that load a Whisper model (run with `pytest -m slow`)",
]
